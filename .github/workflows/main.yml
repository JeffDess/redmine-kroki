'on':
  push:
    paths-ignore:
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '**.md'
      - 'doc/**'

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Yamllint
        uses: karancode/yamllint-github-action@v2.1.1
        with:
          yamllint_config_filepath: .yamllint.yml
          yamllint_strict: true

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Convco
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            range="$BEFORE..$GITHUB_SHA"
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              range="$GITHUB_SHA~1..$GITHUB_SHA"
            fi
          else
            range="origin/main..HEAD"
          fi
          nix run .#convco -- check "$range"

  test-v5:
    name: Test Redmine 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: REDMINE_VERSION=5 scripts/test-ci.sh

  test-v6:
    name: Test Redmine 6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: REDMINE_VERSION=6 scripts/test-ci.sh

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: [lint, test-v5, test-v6]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bundle
        run: |
          mv src redmine_kroki
          rm -rf redmine_kroki/test
          zip -r redmine_kroki.zip redmine_kroki
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: redmine_kroki.zip
          tag_name: ${{ github.ref_name }}
