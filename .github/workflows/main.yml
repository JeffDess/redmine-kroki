'on':
  push:
    paths-ignore:
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '**.md'
      - 'doc/**'

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Lint
        run: nix run .#lint

  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Check
        run: nix flake check

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Lint commit messages
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            from=$(git describe --tags --abbrev=0 --match 'v[0-9]*' \
              "$GITHUB_SHA^" 2>/dev/null || true)
            allow_fixup=false
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            from=$PUSH_BEFORE
            allow_fixup=false
          else
            from=origin/$DEFAULT_BRANCH
            allow_fixup=true
          fi

          if ! git rev-parse --verify --quiet "$from^{commit}" >/dev/null; then
            from=
          fi

          flags=()
          if [ "$allow_fixup" = true ]; then
            flags+=(--allow-fixup)
          fi
          nix run .#lint_commits -- "${flags[@]}" \
            --from "$from" --to "$GITHUB_SHA"

  test-v5:
    name: Test Redmine 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Test
        run: REDMINE_VERSION=5 nix run .#test_ci

  test-v6:
    name: Test Redmine 6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Test
        run: REDMINE_VERSION=6 nix run .#test_ci

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: [lint, flake-check, commit-messages, test-v5, test-v6]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#release
